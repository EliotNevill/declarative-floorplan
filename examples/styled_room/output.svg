<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="45.0 20.0 110.0 110.0">
  <title>Styled Room Example</title>
  <rect x="45.0" y="20.0" width="110.0" height="110.0" fill="#ffffff"/>
  <g id="walls">
    <polygon points="73.00,48.00 73.00,52.00 127.00,52.00 127.00,48.00" fill="#1a1a3e" stroke="#0f0f23" stroke-width="1.5"/>
    <polygon points="127.00,48.00 123.00,48.00 123.00,102.00 127.00,102.00" fill="#1a1a3e" stroke="#0f0f23" stroke-width="1.5"/>
    <polygon points="127.00,102.00 127.00,98.00 73.00,98.00 73.00,102.00" fill="#1a1a3e" stroke="#0f0f23" stroke-width="1.5"/>
    <polygon points="73.00,102.00 77.00,102.00 77.00,48.00 73.00,48.00" fill="#1a1a3e" stroke="#0f0f23" stroke-width="1.5"/>
    <polygon points="73.00,98.00 73.00,102.00 127.00,102.00 127.00,98.00" fill="#1a1a3e" stroke="#0f0f23" stroke-width="1.5"/>
  </g>
  <g id="openings">
    <g id="Door" fill="#ffffff" stroke="#cc0000" style="fill-opacity: 1; stroke-width: 2.0; stroke-opacity: 1;" class="Door">
  <g id="Threshold" class="Threshold">
    <polygon points="73.00,87.50 77.00,87.50 77.00,62.50 73.00,62.50" />
  </g>
  <g id="Panel" fill="none" class="Panel">
    <path d="M 77.00,62.50 A 25.00,25.00 0 0,1 102.00,87.50" stroke="#990000" stroke-width="1.5" />
    <line x1="77.00" y1="87.50" x2="102.00" y2="87.50" stroke="#cc0000" stroke-width="2.0" />
  </g>
</g>
    <g id="Window" class="Window">
  <polygon points="82.50,97.50 82.50,102.50 117.50,102.50 117.50,97.50" fill="#c0ffc0" stroke="#00aa00" stroke-width="1.5" />
  <line x1="82.50" y1="100.00" x2="117.50" y2="100.00" stroke="#006600" stroke-width="1.0" />
  <line x1="82.50" y1="98.75" x2="117.50" y2="98.75" stroke="#006600" stroke-width="1.0" />
  <line x1="82.50" y1="101.25" x2="117.50" y2="101.25" stroke="#006600" stroke-width="1.0" />
</g>
  </g>
</svg>